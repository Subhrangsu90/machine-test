<article class="card">
  <img
    [src]="product().thumbnail"
    [alt]="product().title"
    loading="lazy"
    width="200"
    height="200"
  />
  <h3>{{ product().title }}</h3>
  <p class="price">{{ product().price | currency }}</p>
  <p>★ {{ product().rating | number: '1.1-1' }}</p>
  @if (product().stock === 0) {
    <span class="badge">Out of stock</span>
  }
</article>
