<a class="skip-link" href="#main">Skip to content</a>

<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-top">
      <a class="brand" routerLink="/">
        <span class="brand-mark" aria-hidden="true">MT</span>
        <span class="brand-text">
          <span class="brand-name">Machine Test</span>
          <span class="brand-sub">Angular 22 practice</span>
        </span>
      </a>

      <button
        type="button"
        class="theme-toggle"
        [attr.aria-pressed]="theme.isDark()"
        (click)="theme.toggle()"
      >
        <span class="theme-icon" aria-hidden="true">
          @if (theme.isDark()) {
            <svg viewBox="0 0 24 24" width="16" height="16">
              <path
                d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linejoin="round"
              />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" width="16" height="16">
              <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                />
              </g>
            </svg>
          }
        </span>
        <span class="theme-label">Dark mode</span>
      </button>
    </div>

    <nav class="nav" aria-label="Main">
      @for (group of groups; track group.id) {
        <div class="nav-group">
          <p class="nav-label" [id]="group.id">{{ group.label }}</p>
          <ul [attr.aria-labelledby]="group.id">
            @for (link of group.links; track link.path) {
              <li>
                <a
                  class="nav-link"
                  [routerLink]="link.path"
                  routerLinkActive="active"
                  ariaCurrentWhenActive="page"
                >
                  <span class="nav-num" aria-hidden="true">{{ link.task }}</span>
                  <span>{{ link.label }}</span>
                </a>
              </li>
            }
          </ul>
        </div>
      }
    </nav>
  </aside>

  <main id="main" class="content" tabindex="-1">
    <router-outlet />
  </main>
</div>
